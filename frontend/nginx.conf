# Static hosting for the Vite build plus a reverse proxy to the FastAPI service.
# The SPA fallback (try_files ... /index.html) keeps client-side routes working.

upstream quality_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip keeps the dashboard bundle small over the wire
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        proxy_pass http://quality_backend/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://quality_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /openapi.json {
        proxy_pass http://quality_backend/openapi.json;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass http://quality_backend/docs;
        proxy_set_header Host $host;
    }

    location = /redoc {
        proxy_pass http://quality_backend/redoc;
        proxy_set_header Host $host;
    }

    # Fingerprinted assets can be cached aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
